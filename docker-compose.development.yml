# Docker Compose para DESARROLLO
# Uso: docker-compose -f docker-compose.development.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: project_management_mysql_development
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_management_development}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data_development:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app-network-development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development  
    container_name: project_management_backend_development
    restart: unless-stopped
    command: npm run dev 
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-project_management_development}
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/dist
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network-development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: project_management_frontend_development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"  
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network-development

volumes:
  mysql_data_development:
    name: project_management_mysql_data_development

networks:
  app-network-development:  
    driver: bridge
    name: project_management_network_development

